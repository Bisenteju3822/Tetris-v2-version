<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>TetrisV2 Game Tester</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1e1e1e;
      color: white;
      padding: 20px;
    }

    input,
    button {
      padding: 8px;
      margin: 5px;
      font-size: 16px;
    }

    .section {
      margin-top: 20px;
      padding: 10px;
      background-color: #2d2d2d;
      border-radius: 8px;
    }

    textarea {
      width: 100%;
      height: 200px;
      margin-top: 10px;
      background: black;
      color: lime;
      padding: 10px;
      font-family: monospace;
    }
  </style>
</head>

<body>

  <h1>🎮 TetrisV2 Game WebSocket Tester</h1>

  <div class="section">
    <label>Player Name:</label>
    <input id="playerName" type="text" placeholder="e.g. Tejas" />
    <button onclick="joinGame()">Join Game</button>
    <button onclick="exitGame()">Exit Game</button>
  </div>

  <div class="section">
    <label>Piece Index:</label>
    <input id="pieceIndex" type="number" />
    <label>X:</label>
    <input id="coordX" type="number" />
    <label>Y:</label>
    <input id="coordY" type="number" />
    <button onclick="placePiece()">Place Piece</button>
    <button onclick="requestRematch()">Request Rematch</button>
  </div>

  <div class="section">
    <h3>🧩 Game State</h3>
    <pre id="stateBox"></pre>
  </div>

  <script>
    let socket;

    function log(message) {
      const box = document.getElementById("stateBox");
      box.textContent += message + "\n";
      box.scrollTop = box.scrollHeight;
    }

    function joinGame() {
      const name = document.getElementById("playerName").value.trim();
      if (!name) return alert("Enter your name first!");

      socket = new WebSocket("ws://localhost:8000");

      socket.onopen = () => {
        log("✅ Connected to WebSocket server");
        socket.send(JSON.stringify({
          type: "join",
          data: {
            name: name,
            uniqueId: Date.now().toString(),
            playerCount: 2
          }
        }));
      };

      socket.onmessage = (msg) => {
        const message = JSON.parse(msg.data);
        if (message.type === "state") {
          log(`📡 Game State:\n${JSON.stringify(message.data, null, 2)}`);
        } else {
          log(`🔔 Event: ${message.type}\n${JSON.stringify(message.data || "", null, 2)}`);
        }
      };

      socket.onerror = (err) => {
        log("❌ WebSocket Error: " + err.message);
      };

      socket.onclose = () => {
        log("🔌 WebSocket disconnected.");
      };
    }

    function placePiece() {
      const index = parseInt(document.getElementById("pieceIndex").value);
      const x = parseInt(document.getElementById("coordX").value);
      const y = parseInt(document.getElementById("coordY").value);

      if (!socket || socket.readyState !== WebSocket.OPEN) {
        return alert("Connect first.");
      }

      socket.send(JSON.stringify({
        type: "place_piece",
        data: { index, x, y }
      }));
    }

    function requestRematch() {
      if (!socket || socket.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({ type: "rematch_request" }));
    }

    function exitGame() {
      if (!socket || socket.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({ type: "exit" }));
      socket.close();
    }
  </script>

</body>

</html>
